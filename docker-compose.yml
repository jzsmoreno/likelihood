# Likelihood model catalog.
#
#   docker compose up --build            # http://localhost:8000
#   LM_API_TOKEN=secret docker compose up --build
#   LM_PORT=9000 docker compose up       # container and published port
#
# Every value can also be exported in the shell or written to a `.env` file next
# to this compose file (Compose reads it automatically).

name: likelihood-catalog

services:
  catalog:
    build:
      context: .
      args:
        # "true" adds tensorflow, torch, keras-tuner, scikit-learn, pyvis.
        INSTALL_FULL_EXTRAS: "${INSTALL_FULL_EXTRAS:-true}"
    image: likelihood-catalog:latest
    # Reap the child processes used by the playground and the live sessions.
    init: true
    restart: unless-stopped
    ports:
      - "${LM_PUBLISHED_PORT:-8000}:${LM_PORT:-8000}"
    environment:
      LM_HOST: "0.0.0.0"
      LM_PORT: "${LM_PORT:-8000}"
      # Empty token = open catalogue. Set it to require
      # `Authorization: Bearer <token>` on every /api route.
      LM_API_TOKEN: "${LM_API_TOKEN:-}"
      LM_RATE_LIMIT: "${LM_RATE_LIMIT:-0}"
      LM_CORS_ORIGINS: "${LM_CORS_ORIGINS:-}"
      LM_PLAYGROUND: "${LM_PLAYGROUND:-1}"
      LM_INVOKE: "${LM_INVOKE:-1}"
      LM_SESSIONS: "${LM_SESSIONS:-1}"
      LM_CATALOG_TTL: "${LM_CATALOG_TTL:-2}"
      # Address space of each sandboxed model process, in MiB. TensorFlow maps
      # ~2.5 GiB just to import: raise it for heavy models, or set 0 to disable.
      LM_PLAYGROUND_MEMORY: "${LM_PLAYGROUND_MEMORY:-8192}"
      # Long calls: a background invocation may take 15 min and retry a timeout.
      LM_INVOKE_JOB_TIMEOUT: "${LM_INVOKE_JOB_TIMEOUT:-900}"
      LM_INVOKE_MAX_TIMEOUT: "${LM_INVOKE_MAX_TIMEOUT:-3600}"
      LM_INVOKE_JOB_RETRIES: "${LM_INVOKE_JOB_RETRIES:-1}"
      LM_GZIP_MIN_BYTES: "${LM_GZIP_MIN_BYTES:-1024}"
      LM_TRUST_PROXY: "${LM_TRUST_PROXY:-0}"
      # Serve saved models from a mounted directory (see the volumes block):
      # LM_LOAD_ROOT: "/models"
      # LM_LOAD_RESTRICT: "1"
    volumes:
      # Live catalog: editing a model source refreshes the catalogue without
      # rebuilding the image (LM_CATALOG_TTL controls how often it is checked).
      # Read-only because the server only introspects the sources.
      - ./likelihood/models:/app/likelihood/models:ro
      # Saved models for POST /api/models/<id>/load and the "Cargar y usar"
      # panel. Pair it with LM_LOAD_ROOT=/models and LM_LOAD_RESTRICT=1.
      # - ./saved-models:/models:ro
    security_opt:
      - no-new-privileges:true
    # Pin resources when the playground spawns heavy models:
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "2"
    #       memory: 2g
