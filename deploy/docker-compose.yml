# Likelihood model catalog.
#
#   docker compose -f deploy/docker-compose.yml up --build            # http://localhost:8000
#   LM_API_TOKEN=secret docker compose -f deploy/docker-compose.yml up --build
#   LM_PORT=9000 docker compose -f deploy/docker-compose.yml up       # container and published port
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.gpu.yml up --build   # NVIDIA GPU
#
# Every value can also be exported in the shell or written to a `.env` file next
# to this compose file (Compose reads it automatically).

name: likelihood-catalog

services:
  catalog:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # "true" adds tensorflow, torch, keras-tuner, scikit-learn, pyvis.
        INSTALL_FULL_EXTRAS: "${INSTALL_FULL_EXTRAS:-true}"
        # "true" installs `tensorflow[and-cuda]`; combine it with the GPU overlay
        # (deploy/docker-compose.gpu.yml) or `--gpus all` so the container sees
        # the NVIDIA driver. On a GPU host without it TensorFlow logs
        # "Could not find cuda drivers on your machine, GPU will not be used".
        INSTALL_CUDA: "${INSTALL_CUDA:-false}"
    image: likelihood-catalog:latest
    # Reap the child processes used by the playground and the live sessions.
    init: true
    restart: unless-stopped
    ports:
      - "${LM_PUBLISHED_PORT:-8000}:${LM_PORT:-8000}"
    environment:
      LM_HOST: "0.0.0.0"
      LM_PORT: "${LM_PORT:-8000}"
      # Empty token = open catalogue. Set it to require
      # `Authorization: Bearer <token>` on every /api route.
      LM_API_TOKEN: "${LM_API_TOKEN:-}"
      LM_RATE_LIMIT: "${LM_RATE_LIMIT:-0}"
      LM_CORS_ORIGINS: "${LM_CORS_ORIGINS:-}"
      LM_PLAYGROUND: "${LM_PLAYGROUND:-1}"
      LM_INVOKE: "${LM_INVOKE:-1}"
      LM_SESSIONS: "${LM_SESSIONS:-1}"
      LM_CATALOG_TTL: "${LM_CATALOG_TTL:-2}"
      # Open file descriptors of each sandboxed model process. The old 128
      # default made TensorFlow/abseil abort ("Unable to get high fd ... limit=128");
      # 4096 is ample and 0 disables the cap.
      LM_PLAYGROUND_FILES: "${LM_PLAYGROUND_FILES:-4096}"
      # Address space of each sandboxed model process, in MiB. Keep it at 0 (the
      # default) on GPU hosts: a CUDA context reserves a large virtual range and
      # RLIMIT_AS makes pthread_create fail
      # ("Thread tf_data_private_threadpool creation via pthread_create() failed").
      # To bound a runaway model, cap the whole container with
      # deploy.resources.limits.memory instead (see below).
      LM_PLAYGROUND_MEMORY: "${LM_PLAYGROUND_MEMORY:-0}"
      # Long calls: a background invocation may take 15 min and retry a timeout.
      LM_INVOKE_JOB_TIMEOUT: "${LM_INVOKE_JOB_TIMEOUT:-900}"
      LM_INVOKE_MAX_TIMEOUT: "${LM_INVOKE_MAX_TIMEOUT:-3600}"
      LM_INVOKE_JOB_RETRIES: "${LM_INVOKE_JOB_RETRIES:-1}"
      LM_GZIP_MIN_BYTES: "${LM_GZIP_MIN_BYTES:-1024}"
      LM_TRUST_PROXY: "${LM_TRUST_PROXY:-0}"
      # Serve saved models from a mounted directory (see the volumes block):
      # LM_LOAD_ROOT: "/models"
      # LM_LOAD_RESTRICT: "1"
    volumes:
      # Live catalog: editing a model source refreshes the catalogue without
      # rebuilding the image (LM_CATALOG_TTL controls how often it is checked).
      # Read-only because the server only introspects the sources.
      - ../likelihood/models:/app/likelihood/models:ro
      # Training jobs (jobs.json + artifacts/) and the serving store are written
      # under /app/data by the unprivileged user (uid 1001). The image creates
      # that folder with the right owner, so Docker seeds a fresh named volume
      # with it; a bind mount instead needs `sudo chown -R 1001:1001 <host-dir>`
      # or the first write fails with PermissionError: '/app/data'.
      - likelihood-data:/app/data
      # Saved models for POST /api/models/<id>/load and the "Cargar y usar"
      # panel. Pair it with LM_LOAD_ROOT=/models and LM_LOAD_RESTRICT=1.
      # - ./saved-models:/models:ro
    security_opt:
      - no-new-privileges:true
    # Cap the whole container (server plus every sandboxed child) here, now that
    # the per-child address-space limit is disabled by default. TensorFlow +
    # CUDA need several GiB, so raise the value for heavy models:
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "4"
    #       memory: 16g

volumes:
  # jobs.json, the trained artifacts and the serving store. Remove it to start
  # from an empty catalogue of jobs (`docker compose down -v`).
  likelihood-data:
